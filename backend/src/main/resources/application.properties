spring.application.name=gestion-prestamos-v2
spring.config.import=optional:file:backend/.env[.properties],optional:file:.env[.properties]
server.port=${PORT:${FINANCIERA_V2_PORT}}
spring.datasource.url=${FINANCIERA_V2_DATABASE_URL}
spring.datasource.username=${FINANCIERA_V2_DATABASE_USERNAME}
spring.datasource.password=${FINANCIERA_V2_DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${FINANCIERA_V2_DATABASE_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=0
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.time-zone=America/Lima
spring.h2.console.enabled=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
app.admin.username=${FINANCIERA_V2_ADMIN_USERNAME:admin}
app.admin.password=${FINANCIERA_V2_ADMIN_PASSWORD:}
app.seed-password=${FINANCIERA_V2_SEED_PASSWORD:}
app.seed.enabled=${APP_SEED_ENABLED:false}
app.cors.allowed-origins=${FINANCIERA_V2_CORS_ALLOWED_ORIGINS:}
dni.api.url=${DNI_API_URL:https://api.json.pe/api/dni}
dni.api.key=${DNI_API_KEY:}

# Token solo en el servidor; nunca se envía a React.
elruc.api.key=${ELRUC_API_TOKEN:}
