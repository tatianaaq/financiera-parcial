spring.application.name=gestion-prestamos-v2
server.port=${FINANCIERA_V2_PORT:8081}
spring.profiles.default=postgresql
spring.datasource.url=${FINANCIERA_V2_DATABASE_URL:jdbc:postgresql://localhost:5432/financiera_v2}
spring.datasource.username=${FINANCIERA_V2_DATABASE_USERNAME:postgres}
spring.datasource.password=${FINANCIERA_V2_DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.time-zone=America/Lima
spring.h2.console.enabled=false
app.admin.username=${FINANCIERA_V2_ADMIN_USERNAME:admin}
app.admin.password=${FINANCIERA_V2_ADMIN_PASSWORD}
app.seed-password=${FINANCIERA_V2_SEED_PASSWORD}
dni.api.url=https://api.json.pe/api/dni
dni.api.key=${DNI_API_KEY:}
